[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Direct all navigation routes to index.html with 200 HTTP status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache immutable bundled assets for optimal performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for general pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
